suite: deployment defaults
templates:
  - deployment.yaml
tests:
  - it: Tier 2 upgrades stop the old writer before security migrations run
    set:
      persistence.enabled: true
      persistence.embedded.enabled: true
    asserts:
      - equal:
          path: spec.strategy.type
          value: Recreate
      - isNullOrEmpty:
          path: spec.strategy.rollingUpdate

  - it: unsupported multiple application replicas are rejected
    set:
      replicaCount: 2
    asserts:
      - failedTemplate:
          errorPattern: "replicaCount|maximum"

  - it: renders the Deployment with the chart fullname
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-kubeatlas

  - it: defaults image tag to the chart's appVersion
    # Assert the *contract* (image points at our repo with some
    # version tag), not a literal version string. Pinning a literal
    # made the test fail every release bump even though the
    # templated image was correct. helm-unittest's `value:` isn't
    # Go-templated, so we match the repo prefix + any semver-shaped
    # tag with matchRegex instead.
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "^ghcr\\.io/lithastra/kubeatlas:[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$"

  - it: an immutable verified digest takes precedence over the tag
    set:
      image.tag: mutable
      image.digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/lithastra/kubeatlas@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  - it: rejects a malformed image digest
    set:
      image.digest: sha256:not-a-digest
    asserts:
      - failedTemplate:
          errorPattern: "image/digest|pattern"

  - it: hard-pins runAsNonRoot at the pod level
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: hard-pins the four container security fields
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: probes hit /healthz and /readyz on the http port
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz

  - it: leaves non-Go headroom below the default container memory limit
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBEATLAS_CONTAINER_MEMORY_LIMIT_BYTES
            valueFrom:
              resourceFieldRef:
                containerName: kubeatlas
                resource: limits.memory
                divisor: "1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBEATLAS_GO_MEMORY_LIMIT_PERCENT
            value: "75"

  - it: renders an explicit Go memory limit percentage override
    set:
      runtime.goMemoryLimitPercent: 80
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBEATLAS_GO_MEMORY_LIMIT_PERCENT
            value: "80"

  - it: rejects a Go memory percentage without enough process headroom
    set:
      runtime.goMemoryLimitPercent: 91
    asserts:
      - failedTemplate:
          errorPattern: "runtime/goMemoryLimitPercent|maximum"

  - it: renders continuous operational probe defaults without a backup mount
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBEATLAS_OPERATIONS_PROBE_INTERVAL
            value: 15s
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBEATLAS_OPERATIONS_PROBE_TIMEOUT
            value: 5s
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBEATLAS_OPERATIONS_STALE_AFTER
            value: 2m
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBEATLAS_BACKUP_TIMESTAMP_FILE
          any: true
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: backup-status
          any: true

  - it: mounts an explicit backup timestamp ConfigMap read-only
    set:
      operations.backupStatus.configMapRef.name: kubeatlas-backup-status
      operations.backupStatus.configMapRef.key: completed-at
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: KUBEATLAS_BACKUP_TIMESTAMP_FILE
            value: /var/run/kubeatlas/backup/last-successful
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: backup-status
            mountPath: /var/run/kubeatlas/backup
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: backup-status
            configMap:
              name: kubeatlas-backup-status
              items:
                - key: completed-at
                  path: last-successful

  - it: rejects an invalid operational probe duration
    set:
      operations.probeInterval: eventually
    asserts:
      - failedTemplate:
          errorPattern: "operations/probeInterval|pattern"

  - it: rejects an invalid backup ConfigMap name
    set:
      operations.backupStatus.configMapRef.name: Not_A_ConfigMap
    asserts:
      - failedTemplate:
          errorPattern: "configMapRef/name|pattern"

  - it: container exposes a writable /tmp emptyDir on the read-only rootfs
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tmp
            emptyDir: {}
