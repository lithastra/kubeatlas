{{- if .Values.snapshots.enabled }}
{{- $trigger := .Values.snapshots.trigger }}
{{- if and $trigger.cluster (not .Values.multicluster.enabled) }}
{{- fail "snapshots.trigger.cluster requires multicluster.enabled" }}
{{- end }}
{{- if ne (empty $trigger.tokenSecretRef.name) (empty $trigger.tokenSecretRef.key) }}
{{- fail "snapshots.trigger.tokenSecretRef requires both name and key" }}
{{- end }}
{{- if and $trigger.cluster .Values.multicluster.rbac.rules (empty $trigger.tokenSecretRef.name) }}
{{- fail "member triggers with visibility rules require snapshots.trigger.tokenSecretRef" }}
{{- end }}
# F-111 periodic stored-graph observation marker.
#
# Every fullSyncSchedule tick this CronJob runs `kubeatlas snapshot
# trigger`, which POSTs the running server's internal endpoint so a
# snapshot_meta marker is recorded. The Job never touches Postgres
# directly — the server owns the write (one code path, one set of
# permissions).
#
# Rendered only when snapshots.enabled=true; values.schema.json
# already guarantees that implies persistence.enabled=true, so the
# server this targets is always Tier 2.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kubeatlas.fullname" . }}-snapshot
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubeatlas.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.snapshots.fullSyncSchedule | quote }}
  # A slow or stuck run must not pile up behind the next tick.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No Job retry after an unknown write outcome. A later schedule tick is
      # a separate observation, not a retry or an exactly-once guarantee.
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            # Do not reuse kubeatlas.selectorLabels here: the Service selects
            # that complete set and would otherwise route API traffic to this
            # short-lived Pod, which does not listen on the HTTP port.
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: snapshot-trigger
        spec:
          restartPolicy: Never
          # The Job only makes an in-cluster HTTP call — it needs no
          # Kubernetes API access, so it drops the SA token.
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: snapshot-trigger
              image: {{ include "kubeatlas.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /kubeatlas
                - snapshot
                - trigger
                - -trigger=periodic
                - -server=http://{{ include "kubeatlas.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}
                {{- if $trigger.cluster }}
                - {{ printf "--cluster=%s" $trigger.cluster | quote }}
                {{- end }}
              {{- if $trigger.tokenSecretRef.name }}
              env:
                - name: KUBEATLAS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ $trigger.tokenSecretRef.name | quote }}
                      key: {{ $trigger.tokenSecretRef.key | quote }}
                      optional: false
              {{- end }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
{{- end }}
