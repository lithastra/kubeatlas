{{- if .Values.rbac.create -}}
# Cluster-wide read-only access. The verbs are HARD-CODED to
# [get, list, watch] — they are not exposed as a Helm value. KubeAtlas
# is read-only, always (Phase 1 §2.3 promise #3); changing this list
# changes the security model and must go through a code review.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeatlas.fullname" . }}
  labels:
    {{- include "kubeatlas.labels" . | nindent 4 }}
rules:
  # Core API group resources we watch.
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - services
      - configmaps
      - persistentvolumeclaims
      - serviceaccounts
    verbs: ["get", "list", "watch"]
  # apps/v1
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  # batch/v1
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  # networking.k8s.io
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  # autoscaling/v2
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  # gateway.networking.k8s.io (optional — controller may not be installed)
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gateways
      - httproutes
    verbs: ["get", "list", "watch"]
  # RBAC graph resources.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - roles
      - rolebindings
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  # Optional Kyverno policy and report CRDs.
  - apiGroups: ["kyverno.io"]
    resources:
      - clusterpolicies
      - policies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["wgpolicyk8s.io"]
    resources:
      - policyreports
      - clusterpolicyreports
    verbs: ["get", "list", "watch"]
  # Optional Gatekeeper templates and dynamically named constraints.
  # A resource wildcard is safe inside the non-core constraints API group:
  # it cannot match core/v1 Secrets.
  - apiGroups: ["templates.gatekeeper.sh"]
    resources:
      - constrainttemplates
    verbs: ["get", "list", "watch"]
  - apiGroups: ["constraints.gatekeeper.sh"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # apiextensions.k8s.io — Phase 2 P2-T10 dynamic CRD discovery.
  # Watching CRDs themselves lets pkg/crd.Discovery register supported
  # per-CRD informers as operators land at runtime. Access to the CRs is
  # intentionally enumerated above. A wildcard across every API group would
  # also grant full read access to core/v1 Secrets; Kubernetes RBAC has no
  # metadata-only Secret permission, so that broad rule is prohibited.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
{{- end }}
