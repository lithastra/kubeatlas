version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      # Kubernetes 0.x minor releases can break APIs. Review the SDK and
      # controller-runtime as one compatible train, separate from other Go deps.
      kubernetes-sdk:
        patterns: ['k8s.io/*', 'sigs.k8s.io/controller-runtime']
      go-dependencies:
        patterns: ['*']
        exclude-patterns: ['k8s.io/*', 'sigs.k8s.io/controller-runtime']
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-dependencies:
        patterns: ['*']
        # Major migrations stay in separate PRs; do not bundle them with
        # routine updates or bypass npm peer-dependency checks.
        update-types: ['minor', 'patch']

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs-dependencies:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /images/postgres-age
    schedule:
      interval: weekly
