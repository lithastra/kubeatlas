name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# A contract gate runs before the three publishing jobs. The PostgreSQL + AGE
# image is immutable: an existing recipe-version tag is verified and reused,
# never overwritten. Use release-preflight.yml on main before creating a tag.
# A manual dispatch is accepted only when its selected ref is a v* tag;
# dispatching from a branch safely skips every job. The GitHub Release stays a
# draft until a human clicks Publish, but images and the chart publish during
# this workflow.
#
# The workflow assumes the repo's "Read and write permissions" for
# GITHUB_TOKEN is enabled in Settings → Actions → General.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-contract:
    name: Release metadata + immutable dependency contract
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release contract
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash test/verify/release-contract.sh "$RELEASE_TAG"

  postgres-age-push:
    name: Reuse or publish immutable PostgreSQL + AGE image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: release-contract
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: oras-project/setup-oras@v2.0.1
        with:
          version: 1.3.3

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load immutable image coordinates
        id: image
        run: |
          set -euo pipefail
          source images/postgres-age/image.env
          if [[ ! "$POSTGRES_AGE_REPOSITORY" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]] ||
             [[ ! "$POSTGRES_AGE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid PostgreSQL + AGE image coordinates."
            exit 1
          fi
          echo "ref=${POSTGRES_AGE_REPOSITORY}:${POSTGRES_AGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Check whether immutable image already exists
        id: existing-image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE" --raw \
               >/tmp/postgres-age-manifest.json \
               2>/tmp/postgres-age-inspect.err; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Reusing existing immutable image: $IMAGE"
          elif grep -Eqi 'manifest unknown|not found' /tmp/postgres-age-inspect.err; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist yet; this workflow may publish it once."
          else
            cat /tmp/postgres-age-inspect.err >&2
            echo "::error::Could not determine whether $IMAGE exists; refusing to publish."
            exit 1
          fi

      - name: Build and push multi-arch PostgreSQL + AGE
        if: steps.existing-image.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: images/postgres-age
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          provenance: true
          sbom: true

      - name: Verify multi-arch image and attestations
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools inspect "$IMAGE" --raw \
                 >/tmp/postgres-age-manifest.json 2>/tmp/postgres-age-inspect.err; then
              break
            fi
            if [[ "$attempt" == 5 ]]; then
              cat /tmp/postgres-age-inspect.err >&2
              exit 1
            fi
            sleep 5
          done

          jq -e '
            (.manifests // []) as $manifests |
            any($manifests[]; .platform.os == "linux" and .platform.architecture == "amd64") and
            any($manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
          ' /tmp/postgres-age-manifest.json >/dev/null

          repository="${IMAGE%:*}"
          attestation_count=0
          while IFS= read -r digest; do
            attestation_count=$((attestation_count + 1))
            docker buildx imagetools inspect "${repository}@${digest}" --raw \
              >"/tmp/postgres-age-attestation-${attestation_count}.json"
            jq -e '
              [.layers[]?.annotations["in-toto.io/predicate-type"]] as $predicates |
              ($predicates | index("https://spdx.dev/Document")) != null and
              ($predicates | index("https://slsa.dev/provenance/v1")) != null
            ' "/tmp/postgres-age-attestation-${attestation_count}.json" >/dev/null
          done < <(
            jq -r '.manifests[] |
              select(.annotations["vnd.docker.reference.type"] == "attestation-manifest") |
              .digest' /tmp/postgres-age-manifest.json
          )

          if [[ "$attestation_count" -lt 2 ]]; then
            echo "::error::Expected an SBOM/provenance attestation manifest per platform."
            exit 1
          fi
          echo "Verified amd64, arm64, SPDX SBOM, and SLSA provenance for $IMAGE"

      - name: Sign and verify the immutable database image digest
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          repository="${IMAGE%:*}"
          digest="$(oras resolve "$IMAGE")"
          bash test/verify/sign-core-artifact.sh "$repository" "$digest"

  goreleaser:
    name: goreleaser (binaries + images + draft release)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: release-contract
    permissions:
      contents: write    # create the GitHub Release
      packages: write    # push images to ghcr.io
      id-token: write    # keyless-sign the immutable application image digest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web bundle
        # Goreleaser's before-hook copies web/dist into
        # cmd/kubeatlas/web/dist so //go:embed picks it up. We must
        # build the bundle here first because goreleaser doesn't
        # touch npm.
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=low
          npm run build

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: oras-project/setup-oras@v2.0.1
        with:
          version: 1.3.3

      - uses: sigstore/cosign-installer@v4.1.2

      # Extract the CHANGELOG section that matches this tag into a
      # file goreleaser consumes via --release-notes. The old static
      # `release.header:` block in .goreleaser.yml made every release
      # card look identical; this pulls the real per-version content
      # from CHANGELOG.md instead.
      - name: Extract release notes from CHANGELOG
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Prerelease tags (e.g. v1.4.0-rc.1) reuse the base version's
          # CHANGELOG section — sections are keyed by the final vX.Y.Z,
          # and changelog-extract needs an exact match. Strip any
          # `-suffix` so an RC build resolves to its target release's
          # notes; a final tag is unchanged.
          BASE="${REF_NAME%%-*}"
          make changelog-extract VERSION="${BASE}" OUT=/tmp/release-notes.md

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the version to the tag that triggered this run. goreleaser
          # otherwise derives it from `git describe`, which is ambiguous
          # when two tags (e.g. a vX.Y.Z-rc.N and the final vX.Y.Z) point
          # at the same commit and would silently build the wrong one.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Verify attestations, sign, and verify the application image digest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repository=ghcr.io/lithastra/kubeatlas
          version="${RELEASE_TAG#v}"
          digest="$(oras resolve "${repository}:${version}")"
          bash test/verify/image-attestations.sh "$repository" "$digest"
          bash test/verify/sign-core-artifact.sh "$repository" "$digest"

      - name: Upload dist as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  helm-push:
    name: Push Helm Chart to ghcr.io OCI
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - goreleaser
      - postgres-age-push
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.20.0

      - uses: oras-project/setup-oras@v2.0.1
        with:
          version: 1.3.3

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Login to GHCR for Cosign
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR for Helm
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Package and push chart
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          # Strip the leading 'refs/tags/v' from the tag so the chart
          # version is a clean semver like 0.1.0.
          VERSION="${GIT_REF#refs/tags/v}"
          if [ "$VERSION" = "$GIT_REF" ]; then
            echo "::error::release.yml ran outside a tag context; refusing to push." >&2
            exit 1
          fi
          helm package helm/kubeatlas --version "$VERSION" --app-version "$VERSION"
          helm push "kubeatlas-${VERSION}.tgz" oci://ghcr.io/lithastra/charts

      - name: Sign and verify the immutable Helm chart digest
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          version="${GIT_REF#refs/tags/v}"
          repository=ghcr.io/lithastra/charts/kubeatlas
          digest="$(oras resolve "${repository}:${version}")"
          bash test/verify/sign-core-artifact.sh "$repository" "$digest"

  core-artifact-audit:
    name: Anonymous signed core artifacts on clean Kubernetes
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - postgres-age-push
      - goreleaser
      - helm-push
    permissions:
      contents: read
    steps:
      - name: Record and enforce publishing prerequisites
        env:
          POSTGRES_RESULT: ${{ needs.postgres-age-push.result }}
          GORELEASER_RESULT: ${{ needs.goreleaser.result }}
          HELM_RESULT: ${{ needs.helm-push.result }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          jq -n \
            --arg status failed \
            --arg releaseTag "$RELEASE_TAG" \
            --arg releaseCommit "$RELEASE_COMMIT" \
            --arg postgres "$POSTGRES_RESULT" \
            --arg goreleaser "$GORELEASER_RESULT" \
            --arg helm "$HELM_RESULT" \
            '{
              status: $status,
              release: {tag: $releaseTag, commit: $releaseCommit},
              publishingJobs: {
                postgresAge: $postgres,
                goreleaser: $goreleaser,
                helm: $helm
              }
            }' >/tmp/kubeatlas-core-artifact-audit.json
          test "$POSTGRES_RESULT" = success
          test "$GORELEASER_RESULT" = success
          test "$HELM_RESULT" = success

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oras-project/setup-oras@v2.0.1
        with:
          version: 1.3.3

      - uses: sigstore/cosign-installer@v4.1.2

      - uses: azure/setup-helm@v5
        with:
          version: v3.20.0

      - name: Create a clean vanilla Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          version: v0.32.0
          node_image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
          cluster_name: kubeatlas-core-artifact-audit
          wait: 120s

      - name: Configure deliberately anonymous registry clients
        run: |
          set -euo pipefail
          anonymous_config="$RUNNER_TEMP/anonymous-docker"
          mkdir -p "$anonymous_config"
          printf '{"auths":{}}\n' >"$anonymous_config/config.json"
          printf '{"auths":{}}\n' >"$anonymous_config/helm-registry.json"
          echo "DOCKER_CONFIG=$anonymous_config" >>"$GITHUB_ENV"
          echo "HELM_REGISTRY_CONFIG=$anonymous_config/helm-registry.json" >>"$GITHUB_ENV"

      - name: Verify the GitHub Release is still draft-gated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(gh api \
            "repos/lithastra/kubeatlas/releases/tags/${RELEASE_TAG}" \
            --jq '.draft == true')" = true

      - name: Audit signatures, attestations, anonymous pulls, and chart install
        env:
          KUBEATLAS_RELEASE_TAG: ${{ github.ref_name }}
          KUBEATLAS_RELEASE_COMMIT: ${{ github.sha }}
          KUBEATLAS_ARTIFACT_EVIDENCE_FILE: /tmp/kubeatlas-core-artifact-audit.json
          KUBEATLAS_REQUIRE_ANONYMOUS: true
        run: bash test/verify/core-artifact-audit.sh

      - name: Upload bounded core artifact audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-artifact-audit-${{ github.ref_name }}
          path: /tmp/kubeatlas-core-artifact-audit.json
          if-no-files-found: error
          retention-days: 30
