name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Three jobs publish the PostgreSQL + AGE image, build the binaries
# and application image, create a draft GitHub Release, and push the
# Helm chart. A manual dispatch is accepted only when its selected
# ref is a v* tag; dispatching from a branch safely skips every job.
# The Release stays a draft until a human clicks Publish.
#
# The workflow assumes the repo's "Read and write permissions" for
# GITHUB_TOKEN is enabled in Settings → Actions → General.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  postgres-age-push:
    name: Push PostgreSQL + AGE image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch PostgreSQL + AGE
        uses: docker/build-push-action@v6
        with:
          context: images/postgres-age
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/lithastra/postgres-age:16.6-age1.6.0-rc0.1
          provenance: true
          sbom: true

  goreleaser:
    name: goreleaser (binaries + images + draft release)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write    # create the GitHub Release
      packages: write    # push images to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web bundle
        # Goreleaser's before-hook copies web/dist into
        # cmd/kubeatlas/web/dist so //go:embed picks it up. We must
        # build the bundle here first because goreleaser doesn't
        # touch npm.
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Extract the CHANGELOG section that matches this tag into a
      # file goreleaser consumes via --release-notes. The old static
      # `release.header:` block in .goreleaser.yml made every release
      # card look identical; this pulls the real per-version content
      # from CHANGELOG.md instead.
      - name: Extract release notes from CHANGELOG
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Prerelease tags (e.g. v1.4.0-rc.1) reuse the base version's
          # CHANGELOG section — sections are keyed by the final vX.Y.Z,
          # and changelog-extract needs an exact match. Strip any
          # `-suffix` so an RC build resolves to its target release's
          # notes; a final tag is unchanged.
          BASE="${REF_NAME%%-*}"
          make changelog-extract VERSION="${BASE}" OUT=/tmp/release-notes.md

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes=/tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the version to the tag that triggered this run. goreleaser
          # otherwise derives it from `git describe`, which is ambiguous
          # when two tags (e.g. a vX.Y.Z-rc.N and the final vX.Y.Z) point
          # at the same commit and would silently build the wrong one.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Upload dist as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  helm-push:
    name: Push Helm Chart to ghcr.io OCI
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - goreleaser
      - postgres-age-push
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.20.0

      - name: Login to GHCR for Helm
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Package and push chart
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          # Strip the leading 'refs/tags/v' from the tag so the chart
          # version is a clean semver like 0.1.0.
          VERSION="${GIT_REF#refs/tags/v}"
          if [ "$VERSION" = "$GIT_REF" ]; then
            echo "::error::release.yml ran outside a tag context; refusing to push." >&2
            exit 1
          fi
          helm package helm/kubeatlas --version "$VERSION" --app-version "$VERSION"
          helm push "kubeatlas-${VERSION}.tgz" oci://ghcr.io/lithastra/charts
