name: E2E Tier 2 (kind)

# Phase 2 and v1.5.2 security-upgrade acceptance: stand up a kind cluster with
# CNPG, prove released v1.5.1 persisted a Secret canary, upgrade to the local
# chart/image, prove schema 11 removed it, then run the wider Tier 2 verifier.
#
# The workflow uses no untrusted GitHub event inputs in run: blocks;
# the only env vars it sets are constants we control (KUBEATLAS_*).
# Runs on demand and on every PR that touches the wired-together
# subsystems. Skips paths-untouched PRs because the workflow is slow
# (~10 min) compared to the rest of CI.
on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'pkg/crd/**'
      - 'pkg/discovery/**'
      - 'pkg/extractor/**'
      - 'pkg/graph/**'
      - 'pkg/snapshot/**'
      - 'pkg/store/postgres/**'
      - 'pkg/api/metrics.go'
      - 'pkg/api/server.go'
      - 'pkg/api/handlers.go'
      - 'helm/**'
      - 'test/verify/phase2.sh'
      - 'test/verify/v152-secret-boundary.sh'
      - 'images/postgres-age/**'
      - '.github/workflows/e2e-kind-tier2.yml'
  workflow_dispatch:

jobs:
  e2e-kind-tier2:
    name: kind + CNPG + kubeatlas Tier 2
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: v3.20.0

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.24.0
          node_image: kindest/node:v1.31.0
          cluster_name: kubeatlas-tier2
          wait: 120s

      - name: Add CloudNativePG Helm repository
        run: |
          helm repo add cloudnative-pg https://cloudnative-pg.io/charts
          helm repo update

      - name: Install the external CNPG operator
        run: |
          helm upgrade --install cnpg \
            cloudnative-pg/cloudnative-pg \
            --version 0.22.1 \
            --namespace cnpg-system --create-namespace \
            --wait --timeout 5m
          kubectl rollout status \
            deployment/cnpg-cloudnative-pg \
            --namespace cnpg-system \
            --timeout=2m

      - name: Build kubeatlas binary (CGO_ENABLED=0)
        run: |
          mkdir -p cmd/kubeatlas/web/dist
          # Empty index.html keeps the embed_web build tag happy on
          # this Tier 2 verifier path; the e2e-kind PR-gating job
          # already exercises the real Web UI bundle. The //go:embed
          # directive is package-relative, so the placeholder must live
          # under cmd/kubeatlas/web/dist (not the repo root).
          echo '<html><body>tier2 placeholder</body></html>' > cmd/kubeatlas/web/dist/index.html
          CGO_ENABLED=0 go build \
            -tags embed_web \
            -o bin/kubeatlas ./cmd/kubeatlas

      - name: Build kubeatlas runtime image
        run: |
          # Dockerfile expects the binary to already be in the build
          # context — see the comment at the top of Dockerfile.
          # The Dockerfile COPYs linux/${TARGETARCH}/kubeatlas (the layout
          # goreleaser stages), so place the binary under linux/amd64/ in
          # the build context rather than at its root.
          mkdir -p .docker-context/linux/amd64
          cp Dockerfile .docker-context/
          cp bin/kubeatlas .docker-context/linux/amd64/kubeatlas
          docker build -t kubeatlas:tier2-test .docker-context

      - name: Build CloudNativePG-compatible PostgreSQL + AGE image
        # The v1.5.1 release publishes this image to GHCR. PR E2E
        # builds it locally so validation does not depend on an
        # unreleased package.
        run: docker build -t local-postgres-age:16.6-age1.6.0-rc0.1 images/postgres-age

      - name: Load images into kind
        run: |
          kind load docker-image kubeatlas:tier2-test \
            --name kubeatlas-tier2
          kind load docker-image local-postgres-age:16.6-age1.6.0-rc0.1 \
            --name kubeatlas-tier2

      - name: Create the Secret canary fixture before v1.5.1 starts
        run: |
          kubectl create namespace kubeatlas
          kubectl create secret generic database-credentials \
            --namespace kubeatlas \
            --from-literal=password=kubeatlas-v152-upgrade-secret-canary \
            --from-literal=token=kubeatlas-v152-upgrade-token-canary
          kubectl create deployment secret-consumer \
            --namespace kubeatlas \
            --image=registry.k8s.io/pause:3.10
          kubectl set env deployment/secret-consumer \
            --namespace kubeatlas \
            --from=secret/database-credentials

      - name: Install released v1.5.1 Tier 2 baseline
        run: |
          helm install kubeatlas \
            oci://ghcr.io/lithastra/charts/kubeatlas \
            --version 1.5.1 \
            --namespace kubeatlas \
            --set persistence.enabled=true \
            --set persistence.embedded.enabled=true \
            --set persistence.embedded.image=local-postgres-age:16.6-age1.6.0-rc0.1 \
            --set persistence.embedded.storageSize=2Gi \
            --set snapshots.enabled=true \
            --set rulePacks.openshift=true \
            --wait --timeout 8m

      - name: Prove v1.5.1 stored the Secret canary
        env:
          KUBEATLAS_NAMESPACE: kubeatlas
          KUBEATLAS_RELEASE: kubeatlas
        run: bash test/verify/v152-secret-boundary.sh baseline

      - name: Upgrade v1.5.1 to the local v1.5.2 chart
        run: |
          helm upgrade kubeatlas helm/kubeatlas \
            --namespace kubeatlas \
            --reuse-values \
            --set image.repository=kubeatlas \
            --set image.tag=tier2-test \
            --set image.pullPolicy=Never \
            --set persistence.enabled=true \
            --set persistence.embedded.enabled=true \
            --set persistence.embedded.image=local-postgres-age:16.6-age1.6.0-rc0.1 \
            --set persistence.embedded.storageSize=2Gi \
            --set snapshots.enabled=true \
            --set rulePacks.openshift=true \
            --wait --timeout 8m

      - name: Verify the v1.5.2 Secret boundary and snapshot path
        env:
          KUBEATLAS_NAMESPACE: kubeatlas
          KUBEATLAS_RELEASE: kubeatlas
        run: bash test/verify/v152-secret-boundary.sh upgraded

      - name: Run verify/phase2.sh
        env:
          KUBEATLAS_NAMESPACE: kubeatlas
          KUBEATLAS_RELEASE: kubeatlas
        run: bash test/verify/phase2.sh

      - name: Verify CNPG failure recovery and uninstall retention
        env:
          KUBEATLAS_NAMESPACE: kubeatlas
          KUBEATLAS_RELEASE: kubeatlas
        run: bash test/verify/tier2-lifecycle.sh

      - name: kubectl describe + recent logs (debug aid on failure)
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get clusters.postgresql.cnpg.io -A
          kubectl get pvc -A
          kubectl describe pod -n kubeatlas -l app.kubernetes.io/name=kubeatlas || true
          kubectl logs -n kubeatlas deploy/kubeatlas --tail=200 || true
          kubectl logs -n cnpg-system deploy/cnpg-cloudnative-pg --tail=200 || true

      - name: Upload kubeatlas logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kubeatlas-tier2-logs
          path: |
            /tmp/kubeatlas-*.log
          if-no-files-found: ignore
          retention-days: 7
