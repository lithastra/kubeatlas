name: E2E Snapshots (kind)

# Phase 3 M7 acceptance (P3-T6): stand up a kind cluster with CNPG,
# install kubeatlas in Tier 2 mode with the F-111 snapshot writer
# enabled, then run test/verify/phase3.sh part 1 — F-109
# NetworkPolicy edges plus the F-111 snapshot writer + diff
# endpoint — and the snapshot-write-storm chaos scenario.
#
# The workflow uses no untrusted GitHub event inputs in run: blocks;
# the only env vars it sets are constants we control (KUBEATLAS_*).
# Runs on PRs that touch the snapshot / NetworkPolicy subsystems.
on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'pkg/snapshot/**'
      - 'pkg/discovery/**'
      - 'pkg/store/**'
      - 'pkg/graph/store.go'
      - 'pkg/graph/snapshot.go'
      - 'pkg/graph/analysis/snapshot_diff.go'
      - 'pkg/api/snapshot*.go'
      - 'pkg/api/networkpolicy*.go'
      - 'pkg/extractor/networkpolicy.go'
      - 'helm/**'
      - 'test/verify/phase3.sh'
      - 'test/chaos/snapshot-write-storm.sh'
      - 'test/petclinic/phase3-networkpolicy.yaml'
      - '.github/workflows/e2e-kind-snapshots.yml'
  workflow_dispatch:

jobs:
  e2e-kind-snapshots:
    name: kind + CNPG + kubeatlas snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.20.0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.24.0
          node_image: kindest/node:v1.31.0
          cluster_name: kubeatlas-snapshots
          wait: 120s

      - name: Install Gateway API CRDs required by the fixture
        run: |
          kubectl apply --server-side \
            -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml
          kubectl wait \
            --for=condition=Established \
            crd/gateways.gateway.networking.k8s.io \
            crd/httproutes.gateway.networking.k8s.io \
            --timeout=2m

      - name: Install CloudNativePG operator prerequisite
        run: |
          helm repo add cloudnative-pg https://cloudnative-pg.io/charts
          helm repo update
          helm upgrade --install cnpg \
            cloudnative-pg/cloudnative-pg \
            --version 0.22.1 \
            --namespace cnpg-system --create-namespace \
            --wait --timeout 5m
          kubectl wait \
            --for=condition=Established \
            crd/clusters.postgresql.cnpg.io \
            --timeout=2m
          kubectl rollout status \
            deployment/cnpg-cloudnative-pg \
            --namespace cnpg-system \
            --timeout=2m

      - name: Build kubeatlas binary (CGO_ENABLED=0)
        run: |
          mkdir -p cmd/kubeatlas/web/dist
          echo '<html><body>snapshots placeholder</body></html>' > cmd/kubeatlas/web/dist/index.html
          CGO_ENABLED=0 go build \
            -tags embed_web \
            -o bin/kubeatlas ./cmd/kubeatlas

      - name: Build kubeatlas runtime image
        run: |
          # The Dockerfile COPYs linux/${TARGETARCH}/kubeatlas (the layout
          # goreleaser stages), so place the binary under linux/amd64/ in
          # the build context rather than at its root.
          mkdir -p .docker-context/linux/amd64
          cp Dockerfile .docker-context/
          cp bin/kubeatlas .docker-context/linux/amd64/kubeatlas
          docker build -t kubeatlas:snapshots-test .docker-context

      - name: Build CloudNativePG-compatible PostgreSQL + AGE image
        run: docker build -t local-postgres-age:16.6-age1.6.0-rc0.1 images/postgres-age

      - name: Load images into kind
        run: |
          kind load docker-image kubeatlas:snapshots-test \
            --name kubeatlas-snapshots
          kind load docker-image local-postgres-age:16.6-age1.6.0-rc0.1 \
            --name kubeatlas-snapshots

      - name: Helm install kubeatlas with Tier 2 + snapshots enabled
        run: |
          helm install kubeatlas helm/kubeatlas \
            --namespace kubeatlas --create-namespace \
            --set image.repository=kubeatlas \
            --set image.tag=snapshots-test \
            --set image.pullPolicy=Never \
            --set persistence.enabled=true \
            --set persistence.embedded.enabled=true \
            --set persistence.embedded.image=local-postgres-age:16.6-age1.6.0-rc0.1 \
            --set persistence.embedded.storageSize=2Gi \
            --set snapshots.enabled=true \
            --set snapshots.retention=7d \
            --wait --timeout 8m

      - name: kubectl describe + recent logs (debug aid on failure)
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get clusters.postgresql.cnpg.io -A
          kubectl get pvc -A
          kubectl describe pod -n kubeatlas -l app.kubernetes.io/name=kubeatlas || true
          kubectl logs -n kubeatlas deploy/kubeatlas --tail=200 || true
          kubectl logs -n cnpg-system deploy/cnpg-cloudnative-pg --tail=200 || true

      - name: Run verify/phase3.sh part 1 + snapshot-write-storm chaos
        env:
          KUBEATLAS_NAMESPACE: kubeatlas
          KUBEATLAS_RELEASE: kubeatlas
          KUBEATLAS_RUN_CHAOS: '1'
        run: bash test/verify/phase3.sh m7-m8

      - name: Upload kubeatlas logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kubeatlas-snapshots-logs
          path: |
            /tmp/kubeatlas-*.log
          if-no-files-found: ignore
          retention-days: 7
